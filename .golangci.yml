# golangci-lint v2 configuration (pinned in the toolchain image, ADR 0001 §14).
version: "2"

linters:
  default: standard
  enable:
    - errorlint
    - gosec
    - revive
    - misspell
    - unconvert

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/daniel-vuky/ops-copilot
